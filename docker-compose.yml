version: "3.9"

services:
  tyag-bot:
    build: .
    container_name: tyag_connect_bot
    restart: unless-stopped      # Auto-restart on crash or VM reboot
    env_file:
      - .env                     # Secrets loaded from .env — never hardcoded
    logging:
      driver: "json-file"
      options:
        max-size: "10m"          # Max 10MB per log file
        max-file: "3"            # Keep 3 rotated log files
